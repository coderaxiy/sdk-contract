      properties:
        permission_id:
          type: integer
          title: Permission Id
      type: object
      required:
      - permission_id
      title: AssignPermissionRequest
    AssignRoleRequest:
      properties:
        role_id:
          type: integer
          title: Role Id
      type: object
      required:
      - role_id
      title: AssignRoleRequest
    AttributeDataType:
      type: string
      enum:
      - text
      - number
      - boolean
      - select
      - multi_select
      title: AttributeDataType
    AttributeTranslationIn:
      properties:
        locale:
          type: string
          maxLength: 10
          title: Locale
        label:
          type: string
          title: Label
      type: object
      required:
      - locale
      - label
      title: AttributeTranslationIn
    AttributeTranslationRead:
      properties:
        locale:
          type: string
          title: Locale
        label:
          type: string
          title: Label
      type: object
      required:
      - locale
      - label
      title: AttributeTranslationRead
    AuditLogRead:
      properties:
        id:
          type: integer
          title: Id
        actor_id:
          type: integer
          title: Actor Id
        action:
          type: string
          title: Action
        target_type:
          type: string
          title: Target Type
        target_id:
          type: integer
          title: Target Id
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
